<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="chat" data-pos="top-left">
  <div id="log"></div>
  <div id="inputwrap" class="hidden">
    <div id="emojis" class="hidden"></div>
    <div id="sugg" class="hidden"></div>
    <div id="inbar">
      <span class="flower">✿</span>
      <span id="chan">SAY</span>
      <input id="txt" type="text" maxlength="240" autocomplete="off" spellcheck="false" />
      <span id="ebtn" class="ibtn" title="emojis"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg></span>
      <span id="send" class="ibtn send"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></span>
    </div>
  </div>
</div>

<div id="bubbles"></div>

<script src="app.js"></script>
</body>
</html>
